# FiscAudit AI - Streamlit Configuration
# Only valid Streamlit config options. Verified to parse as TOML.
# Note: on Streamlit Cloud the platform controls port/headless, so those are omitted.

[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#182238"
secondaryBackgroundColor = "#212D46"
textColor = "#F8FAFC"
font = "sans serif"

[server]
# Max PDF upload size in MB
maxUploadSize = 200
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Set to false once the app is stable, so stack traces are not shown to end users
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[runner]
magicEnabled = true
