# FiscAudit AI - Streamlit Configuration
# Complete settings for development and production deployment

[theme]
# Dark theme configuration
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "sans serif"

[client]
# Client settings
showErrorDetails = true
toolbarMode = "developer"
logger.level = "info"

[server]
# Server settings
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200

[logger]
# Logging configuration
level = "info"
messageFormat = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[client.toolbarMode]
# Hide/show toolbar (development vs production)
# development = "developer"
# production = "minimal"
value = "developer"

[runner]
# Runner settings for async code
magicEnabled = true
fastReruns = true
